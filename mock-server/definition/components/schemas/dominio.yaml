GeneralError:
  description: General Error
  type: object
  properties:
    error:
      type: string
    error_description:
      type: string

AuthenticationToken:
  description: AuthenticationToken
  type: object
  properties:
    access_token:
      type: string
      example: bb8ffb57-a039-4820-8dd9-e9fd3168d0aa
    token_type:
      type: string
      example: Bearer
    expires_in:
      type: integer
      example: 3600
    refresh_token:
      type: string
      example: 16ce7218-0b0e-4566-9fd0-b81a461e9874
    scope:
      type: string
      example: oob

Message:
  type: object
  properties:
    TipoCritica:
      type: string
      example: SUCESSO
    Mensagem:
      type: string
      example: SUCESSO
  required:
    - TipoCritica
    - Mensagem

GeneralErrorSeguroViagem:
  description: General Error
  type: object
  properties:
    message:
      type: string

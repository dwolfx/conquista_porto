GeneralError:
  description: General Error
  type: object
  properties:
    error:
      type: string
    error_description:
      type: string

AuthenticationToken:
  description: AuthenticationToken
  type: object
  properties:
    access_token:
      type: string
      example: bb8ffb57-a039-4820-8dd9-e9fd3168d0aa
    token_type:
      type: string
      example: Bearer
    expires_in:
      type: integer
      example: 3600
    refresh_token:
      type: string
      example: 16ce7218-0b0e-4566-9fd0-b81a461e9874
    scope:
      type: string
      example: oob

DadosCliente:
  description: dados-cliente
  type: object
  properties:
    emailCliente:
      type: string
      example: ricardo.eufrasio@portoseguro.com.br
    estado:
      type: string
      example: SP
    Message:
      type: object
      properties:
        TipoCritica:
          type: string
          example: SUCESSO
        Mensagem: 
          type: string
          example: SUCESSO
    numeroEnderecoResidencial:
      type: string
      example: 11
    numeroTelefone:
      type: string
      example: 996229303
    cpfCnpj:
      type: string
      example: 36275312807
    dddNumeroTelefone:
      type: string
      example: 11
    nomeCliente:
      type: string
      example: Rubao
    dataNascimento:
      description: |
        - Data format ISO 8601. Ex 2020-03-05T12:44Z
        - REF [https://tools.ietf.org/html/rfc3339#section-5.6]
      type: string
      format: date-time
    cep:
      type: string
      example: 01010010
  required:
    - emailCliente
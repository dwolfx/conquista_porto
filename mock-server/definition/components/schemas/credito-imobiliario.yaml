OrcamentoConsultivoRequest:
  description: Orçamento Consultivo
  type: object
  properties:
    consultivo:
      type: object
      properties:
        codigoOfertaConsultiva:
          type: string
          example: VIAGEM
        canalDistribuicao:
          type: string
          example: COR
        identificadorRepresentante:
          type: string
          example: P5005J
        meioComercializacao:
          type: string
          example: Portal
        entradaNegocio:
          type: string
          example: CO2
        voltar:
          type: boolean
          example: true
    acao:
      type: string
      example: CONTRATAR
  required:
    - consultivo
    - acao

OrcamentoOfertaResquest:
  description: Orçamento Oferta
  type: object
  properties:
    orcamento:
      type: object
      example: null
    consultivo:
      type: object
      properties:
        codigoOfertaConsultiva:
          type: string
          example: VIAGEM
        canalDistribuicao:
          type: string
          example: COR
        identificadorRepresentante:
          type: string
          example: P5005J
        meioComercializacao:
          type: string
          example: Portal
        respostas:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: TIPO_VIAGEM
              conteudo:
                type: string
                example: INTERNACIONAL

